<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Meeting Room Booking System</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5fd9'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages/login.css" />
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <div class="brand">Meeting Room Booking System</div>
      <div class="sub">Sign in to continue</div>

      <div id="login-error"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
          <div class="error-text"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
          <div class="error-text"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign in</button>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
